[pytest]
# Pytest configuration for talk2myinbox

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Test
python_functions = test_*

# Minimum version
minversion = 7.0

# Test paths
testpaths = backend/tests

# Add current directory to Python path
pythonpath = backend

# Command line options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    --showlocals
    # Warnings
    --strict-markers
    --strict-config
    # Test duration reporting
    --durations=10
    # Color output
    --color=yes

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, multiple components)
    e2e: End-to-end tests (slowest, full system)
    slow: Slow running tests
    fast: Fast running tests
    smoke: Smoke tests (critical path)
    voice: Voice mode tests
    email: Email functionality tests
    calendar: Calendar functionality tests
    api: API endpoint tests
    agent: AI agent tests
    adapter: External adapter tests
    performance: Performance and load tests
    security: Security tests
    mock: Tests using mocks
    live: Tests requiring live services

# Test filtering
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Coverage options
[coverage:run]
source = backend/app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstract

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = backend/tests/logs/pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# Async tests
asyncio_mode = auto
